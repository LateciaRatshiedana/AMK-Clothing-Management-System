<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMK Clothing - Tailor Live Support</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #f8fafc; margin: 0; font-family: Arial, sans-serif; color: #0f172a; }
    .store-header { background-color: #000000; color: #ffffff; padding: 16px 30px; display: flex; justify-content: space-between; align-items: center; }
    .store-logo { font-size: 20px; font-weight: 900; letter-spacing: 1px; color: #ffffff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
    .chat-container { max-width: 800px; margin: 30px auto; padding: 0 20px; }
    .chat-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.03); display: flex; flex-direction: column; height: 620px; position: relative; }
    .chat-header { background: #0f172a; color: #ffffff; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .chat-title { font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 10px; }
    .status-badge { font-size: 12px; color: #4ade80; display: flex; align-items: center; gap: 6px; }
    .chat-box { flex: 1; padding: 20px; overflow-y: auto; background: #f8fafc; display: flex; flex-direction: column; gap: 12px; }
    
    .msg { max-width: 75%; padding: 12px 16px; border-radius: 10px; font-size: 14px; line-height: 1.4; position: relative; }
    .msg-tailor { background: #ffffff; border: 1px solid #e2e8f0; align-self: flex-start; color: #0f172a; }
    .msg-client { background: #227b75; color: #ffffff; align-self: flex-end; }
    .msg img { max-width: 100%; border-radius: 6px; margin-top: 6px; display: block; max-height: 200px; object-fit: cover; }
    .msg-time { font-size: 10px; margin-top: 4px; opacity: 0.8; text-align: right; }
    .deleted-msg { font-style: italic; opacity: 0.7; color: #cbd5e1 !important; background: #334155 !important; border: 1px dashed #64748b !important; }
    
    .msg-actions { margin-top: 6px; padding-top: 4px; border-top: 1px solid rgba(255,255,255,0.2); display: flex; justify-content: flex-end; gap: 8px; }
    .action-btn { background: rgba(0,0,0,0.25); color: #fff; border: none; padding: 2px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; }
    .action-btn-del { background: rgba(239, 68, 68, 0.8); }

    .chat-footer { padding: 15px 20px; background: #ffffff; border-top: 1px solid #e2e8f0; display: flex; gap: 10px; align-items: center; }
    .chat-input { flex: 1; padding: 12px 16px; border: 1px solid #cbd5e1; border-radius: 6px; outline: none; font-size: 14px; }
    .file-upload-btn { background: #f1f5f9; border: 1px solid #cbd5e1; color: #0f172a; padding: 11px 14px; border-radius: 6px; cursor: pointer; font-size: 15px; display: flex; align-items: center; justify-content: center; }
    .file-upload-btn:hover { background: #e2e8f0; }
    .send-btn { background: #227b75; color: #ffffff; border: none; padding: 11px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px; }

    /* EDIT MODAL */
    .modal-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
    .modal-box { background: #fff; border-radius: 8px; padding: 20px; width: 85%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .modal-box h3 { margin-top: 0; font-size: 16px; margin-bottom: 12px; }
    .modal-box input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; margin-bottom: 15px; outline: none; }
    .modal-btns { display: flex; justify-content: flex-end; gap: 8px; }
    .modal-btn { padding: 8px 14px; border-radius: 4px; border: none; font-weight: bold; font-size: 12px; cursor: pointer; }
    .btn-save { background: #227b75; color: #fff; }
    .btn-cancel { background: #e2e8f0; color: #0f172a; }
  </style>
</head>
<body>

  <header class="store-header">
    <a href="index.html" class="store-logo"><i class="fa-solid fa-scissors" style="color: #227b75;"></i> AMK CLOTHING</a>
    <a href="cart.html" style="color: #ffffff; text-decoration: none; font-size: 13px; font-weight: bold;">&larr; Back to Cart &amp; Tracking</a>
  </header>

  <div class="chat-container">
    <div class="chat-card">
      <div class="chat-header">
        <div class="chat-title"><i class="fa-solid fa-headset" style="color:#227b75;"></i> Master Tailor Live Support (#AMK-8891)</div>
        <div class="status-badge"><i class="fa-solid fa-circle" style="font-size: 8px;"></i> Tailors Online</div>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <form class="chat-footer" onsubmit="handleSendMessage(event)">
        <label for="imageInput" class="file-upload-btn" title="Upload Reference Image">
          <i class="fa-solid fa-image"></i>
        </label>
        <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
        <input type="text" id="chatInput" class="chat-input" placeholder="Type your message or upload a design photo..." autocomplete="off">
        <button type="submit" class="send-btn"><i class="fa-solid fa-paper-plane"></i> Send</button>
      </form>

      <!-- EDIT MODAL -->
      <div class="modal-overlay" id="editModal">
        <div class="modal-box">
          <h3>Edit Message</h3>
          <input type="text" id="editInput" placeholder="Update your message...">
          <div class="modal-btns">
            <button class="modal-btn btn-cancel" onclick="closeEditModal()">Cancel</button>
            <button class="modal-btn btn-save" onclick="saveEditedMessage()">Save Changes</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    let activeEditIndex = null;
    const INITIAL_SEED = [
      { sender: 'tailor', text: 'Hello Latecia! Welcome to AMK Clothing bespoke support. Send us your measurements or design inspiration photos here!', time: 'Just now', isDeleted: false }
    ];

    function loadChatMessages() {
      let messages = JSON.parse(localStorage.getItem('amk_chat_messages'));
      if (!messages || messages.length === 0) {
        messages = INITIAL_SEED;
        localStorage.setItem('amk_chat_messages', JSON.stringify(messages));
      }

      const chatBox = document.getElementById('chatBox');
      chatBox.innerHTML = '';

      messages.forEach((msg, index) => {
        const isClient = msg.sender === 'client';
        const isDeleted = msg.isDeleted;

        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${isClient ? 'msg-client' : 'msg-tailor'} ${isDeleted ? 'deleted-msg' : ''}`;
        
        let contentHtml = isDeleted ? '<i>🚫 This message was deleted</i>' : msg.text;
        if (!isDeleted && msg.image) {
          contentHtml += `<br><img src="${msg.image}" alt="Reference Photo">`;
        }

        let actionsHtml = '';
        if (isClient && !isDeleted) {
          actionsHtml = `
            <div class="msg-actions">
              ${msg.text ? `<button class="action-btn" onclick="openEditModal(${index})"><i class="fa-solid fa-pen"></i> Edit</button>` : ''}
              <button class="action-btn action-btn-del" onclick="deleteMessage(${index})"><i class="fa-solid fa-trash"></i> Delete</button>
            </div>
          `;
        }

        msgDiv.innerHTML = `
          <div>${contentHtml}</div>
          <div class="msg-time">${msg.time} ${msg.isEdited ? '(edited)' : ''}</div>
          ${actionsHtml}
        `;

        chatBox.appendChild(msgDiv);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function deleteMessage(index) {
      let messages = JSON.parse(localStorage.getItem('amk_chat_messages')) || [];
      messages[index].isDeleted = true;
      messages[index].text = "🚫 This message was deleted";
      delete messages[index].image;
      localStorage.setItem('amk_chat_messages', JSON.stringify(messages));
      loadChatMessages();
    }

    function openEditModal(index) {
      let messages = JSON.parse(localStorage.getItem('amk_chat_messages')) || [];
      activeEditIndex = index;
      document.getElementById('editInput').value = messages[index].text;
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      activeEditIndex = null;
      document.getElementById('editModal').style.display = 'none';
    }

    function saveEditedMessage() {
      const newText = document.getElementById('editInput').value.trim();
      if (!newText || activeEditIndex === null) return;

      let messages = JSON.parse(localStorage.getItem('amk_chat_messages')) || [];
      messages[activeEditIndex].text = newText;
      messages[activeEditIndex].isEdited = true;
      localStorage.setItem('amk_chat_messages', JSON.stringify(messages));
      
      closeEditModal();
      loadChatMessages();
    }

    function handleSendMessage(e) {
      e.preventDefault();
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;

      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

      let messages = JSON.parse(localStorage.getItem('amk_chat_messages')) || INITIAL_SEED;
      messages.push({ sender: 'client', text: text, time: timeStr, isDeleted: false, isEdited: false });

      localStorage.setItem('amk_chat_messages', JSON.stringify(messages));
      input.value = '';
      loadChatMessages();
    }

    function handleImageUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(uploadEvent) {
        const imageUrl = uploadEvent.target.result;
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        let messages = JSON.parse(localStorage.getItem('amk_chat_messages')) || INITIAL_SEED;
        messages.push({ sender: 'client', text: '📷 Custom Design Reference Photo:', image: imageUrl, time: timeStr, isDeleted: false, isEdited: false });

        localStorage.setItem('amk_chat_messages', JSON.stringify(messages));
        loadChatMessages();
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadChatMessages();
      setInterval(loadChatMessages, 1500);
    });
  </script>
</body>
</html>
