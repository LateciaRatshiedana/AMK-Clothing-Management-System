<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMK Clothing - Client Sign In</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-center">

  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size: 28px; color: #227b75; margin-bottom: 8px;">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <h2>AMK Clothing</h2>
      <p>Fashion Design Management System</p>
    </div>

    <!-- CLIENT LOGIN FORM -->
    <form id="clientLoginForm" onsubmit="handleClientLogin(event)">
      <div class="form-group">
        <label>Email Address</label>
        <input type="email" id="clientEmailInput" value="latecia@rosebank.co.za" required>
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="clientPasswordInput" value="password123" required>
      </div>

      <button type="submit" class="primary-btn" style="margin-top: 10px;">
        Sign In
      </button>
    </form>

    <div class="auth-switch">
      Don't have an account? <a href="client-signup.html">Create an Account (Sign Up)</a>
    </div>

    <div style="text-align: center; margin-top: 16px;">
      <a href="login-selection.html" style="color: #718096; text-decoration: none; font-size: 13px;">
        ← Back to Portal Selection
      </a>
    </div>
  </div>

  <script>
    function handleClientLogin(event) {
      event.preventDefault(); // Stop default form reload

      const email = document.getElementById('clientEmailInput').value;
      // Extract a clean display name from the email (e.g. "latecia@rosebank.co.za" becomes "Latecia")
      let namePart = email.split('@')[0];
      let formattedName = namePart.charAt(0).toUpperCase() + namePart.slice(1);

      // Save login state in localStorage
      localStorage.setItem('isLoggedIn', 'true');
      localStorage.setItem('userType', 'client');
      localStorage.setItem('userName', formattedName);
      localStorage.setItem('userEmail', email);

      // Immediately redirect straight to index.html storefront to see clothes and items
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
