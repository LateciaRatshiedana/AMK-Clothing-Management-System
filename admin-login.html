<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMK Clothing - Admin & Worker Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-center">

  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size: 32px; color: #227b75; margin-bottom: 6px;">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <h2>AMK Clothing</h2>
      <p>Admin & Worker Portal</p>
    </div>

    <!-- Redirects directly to admin-home.html -->
    <form action="admin-home.html" method="GET">
      <div class="form-group">
        <label>Staff/Admin Email</label>
        <input type="email" required placeholder="admin@amkclothing.com" value="admin@amkclothing.com">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" required placeholder="••••••••" value="admin123">
      </div>
      <button type="submit" class="primary-btn">Sign In as Admin/Worker</button>
    </form>

    <p style="font-size: 12px; color: #718096; text-align: center; margin-top: 15px;">*Worker accounts can only be created by the Admin/Owner.</p>

    <a href="login-selection.html" class="close-modal-text" style="display: block; text-align: center; margin-top: 15px; text-decoration: none;">← Back to Portal Selection</a>
  </div>

</body>
</html>
