<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMK Clothing - Client Sign Up</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-center">

  <div class="auth-card">
    <div class="auth-header">
      <div style="font-size: 28px; color: #227b75; margin-bottom: 4px;">
        <i class="fa-solid fa-scissors"></i>
      </div>
      <h2>AMK Clothing</h2>
      <p>Create Your Client Account</p>
    </div>

    <form action="client-login.html" method="GET" onsubmit="event.preventDefault(); alert('Account created successfully! Please sign in.'); window.location.href='client-login.html';">
      <div class="form-group">
        <label>Name</label>
        <input type="text" required placeholder="Enter your name">
      </div>

      <div class="form-group">
        <label>Surname</label>
        <input type="text" required placeholder="Enter your surname">
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input type="tel" required placeholder="Enter your phone number">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input type="email" required placeholder="Enter your email">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" required placeholder="Create a password">
      </div>

      <div class="form-group">
        <label>Confirm Password</label>
        <input type="password" required placeholder="Confirm your password">
      </div>

      <button type="submit" class="primary-btn">Sign Up</button>
    </form>

    <div class="auth-switch">
      <span>Already have an account?</span> <a href="client-login.html">Sign In</a>
    </div>

    <a href="login-selection.html" class="close-modal-text" style="display: block; text-align: center; margin-top: 15px; text-decoration: none;">← Back to Portal Selection</a>
  </div>

</body>
</html>
