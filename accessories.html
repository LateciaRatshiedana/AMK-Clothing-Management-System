<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMK Clothing - Accessories & Jewelry</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .category-header-banner {
      background: #0f172a;
      color: #ffffff;
      padding: 40px 20px;
      text-align: center;
      margin-bottom: 30px;
    }
    .category-header-banner h1 { margin: 0; font-size: 28px; font-weight: 900; }
    .category-header-banner p { margin: 8px 0 0 0; color: #cbd5e1; font-size: 14px; }
    
    .product-grid button {
      background-color: #000000 !important;
      color: #ffffff !important;
      border: none !important;
      border-radius: 4px;
      padding: 10px 16px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="logo">AMK CLOTHING</div>
    <form action="search-results.html" method="GET" class="search-container">
      <input type="text" name="q" placeholder="Search Accessories..." required />
      <button type="submit" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
    </form>
    <div class="nav-icons">
      <a href="login-selection.html" class="icon-btn" title="Profile"><i class="fa-regular fa-user"></i></a>
      <a href="cart.html" class="icon-btn" title="Cart" onclick="return checkClientAuth('access cart');"><i class="fa-solid fa-cart-shopping"></i></a>
      <a href="wishlist.html" class="icon-btn" title="Wishlist" onclick="return checkClientAuth('view wishlist');"><i class="fa-regular fa-heart"></i></a>
      <a href="client-support.html" class="icon-btn" title="Tailor Support Chat" onclick="return checkClientAuth('chat tailor');"><i class="fa-solid fa-headset"></i></a>
    </div>
  </header>

  <!-- CATEGORY MENU TABS -->
  <nav class="category-nav">
    <a href="all.html" class="nav-item">All</a>
    <a href="women.html" class="nav-item">Women</a>
    <a href="curve.html" class="nav-item">Curve</a>
    <a href="kids.html" class="nav-item">Kids</a>
    <a href="men.html" class="nav-item">Men</a>
    <a href="traditional.html" class="nav-item">Traditional Attire</a>
    <a href="petite.html" class="nav-item">Petite</a>
    <a href="accessories.html" class="nav-item active">Accessories</a>
  </nav>

  <!-- BANNER -->
  <div class="category-header-banner">
    <h1>Bespoke Jewelry & Accessories</h1>
    <p>Luxury gold jewelry sets, custom-tailored belts, and handcrafted African accessories to complement your outfit.</p>
  </div>

  <main class="products-container" style="max-width: 1100px; margin: 0 auto; padding: 0 20px 50px 20px;">
    <div class="product-grid" id="productGrid">
      <!-- Accessories render here from script.js -->
    </div>
  </main>

  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof renderCategoryProducts === "function") {
        renderCategoryProducts("Accessories");
      }
    });

    function checkClientAuth(actionName) {
      const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true' || localStorage.getItem('userType') === 'client';
      if (!isLoggedIn) {
        alert('Please log in or create an account to ' + actionName + '.');
        window.location.href = 'login-selection.html';
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
